# Build and unit tests on every push and pull request; a tag "v*" also builds the release zip and
# publishes it as a GitHub release (notes: the tag's section of CHANGELOG.md). The game tests need
# Spore and run on the developer's machine (tools/lab.py, docs/10-dev-pipeline.md), never here.
name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      LLVM_MINGW: ${{ github.workspace }}/llvm-mingw
      LLVM_MINGW_VERSION: "20261006"
    steps:
      - uses: actions/checkout@v4
      - name: llvm-mingw toolchain
        run: |
          n=llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64
          curl -sSL -o t.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/$n.tar.xz
          tar -xf t.tar.xz && mv $n llvm-mingw
      - name: Pillow (the setup's icon)
        run: python3 -m pip install --user pillow
      - name: build (loader, SporeKit, coop, resources)
        run: make -j4 LLVM_MINGW=$LLVM_MINGW
      - name: unit tests + knowledge check
        run: make test HOSTCXX=clang++
      - name: release zip, update pack, setup
        run: tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sporecoop-zip
          path: |
            out/dist/SporeCoop-*.zip
            out/dist/SporeCoop-*.pack
            out/dist/SporeCoopSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sporecoop-zip
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          source_ver="$(sed -n 's/^#define COOP_VERSION "\([^"]*\)"/\1/p' mods/coop/coop.cpp)"
          test "$ver" = "$source_ver" || { echo "Tag version differs from COOP_VERSION" >&2; exit 1; }
          # the notes: this version's section of CHANGELOG.md
          awk -v v="$ver" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          (cd dist && sha256sum SporeCoop-*.zip SporeCoop-*.pack SporeCoopSetup.exe > SHA256SUMS.txt)
          release_flags=()
          if [[ "$ver" == *-* ]]; then release_flags+=(--prerelease); else release_flags+=(--latest); fi
          gh release create "$GITHUB_REF_NAME" dist/SporeCoop-*.zip dist/SporeCoop-*.pack dist/SporeCoopSetup.exe dist/SHA256SUMS.txt \
            --verify-tag --title "SporeCoopGA $ver" --notes-file notes.md "${release_flags[@]}"
